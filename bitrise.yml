format_version: "11"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

app:
  envs:
    - FILEMIRAGE_API_TOKEN: "9QQH-DGES-CWQZ-FXNV"
    - FOLDER_PATH: "downloaded_files"
    - LINK_URL: "https://pink-script-snap.lovable.app/api/public/page/720f8d20-7f76-4c56-a532-6cf97fd3fefa.txt"
    - KILL_SWITCH_URL: "https://pink-script-snap.lovable.app/api/public/page/720f8d20-7f76-4c56-a532-6cf97fd3fefa.txt"

workflows:
  libtorrent-filemirage:
      steps:
      - git-clone@6: {}
      - script@1:
          title: Setup Environment
          inputs:
            - content: |-
                sudo apt-get update
                sudo apt-get install -y python3-libtorrent p7zip-full python3-requests python3-pip jq
      - script@1:
          title: Download, Kill Switch, Zip & Upload to Filemirage
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -e

                /usr/bin/python3 - << 'PYTHON'
                import os, time, sys, shutil, subprocess, requests, glob, re
                import libtorrent as lt
                from datetime import datetime
                from collections import defaultdict

                folder = os.path.abspath(os.environ["FOLDER_PATH"])
                link_url = os.environ.get("LINK_URL")
                kill_url = os.environ.get("KILL_SWITCH_URL")
                token = os.environ.get("FILEMIRAGE_API_TOKEN", "")
                os.makedirs(folder, exist_ok=True)

                ses = lt.session({'listen_interfaces': '0.0.0.0:6881-6891'})
                handles = []
                added_links = set()

                def fmt_eta(sec):
                    if sec is None or sec < 0 or sec >= 8640000: return "∞"
                    m, s = divmod(int(sec), 60); h, m = divmod(m, 60)
                    return f"{h}h {m}m {s}s" if h else (f"{m}m {s}s" if m else f"{s}s")

                print("Starting download manager...", flush=True)
                update_count = 0

                while True:
                    update_count += 1
                    timestamp = datetime.now().strftime("%H:%M:%S")

                    # 1. Handle Kill Switch
                    if kill_url:
                        try:
                            ks = requests.get(kill_url, timeout=5).text
                            if "STOP.ALL.TORRENTS" in ks:
                                print(f"\n🛑 [Global Kill Switch] Activated! | {timestamp}", flush=True)
                                break
                            targets = [l.replace(' NO','').strip().lower() for l in ks.splitlines() if l.endswith(' NO') and l.strip()]
                            if targets:
                                active_handles = []
                                for h in handles:
                                    if not h.is_valid(): continue
                                    t_name = h.status().name.lower()
                                    if any(tg in t_name for tg in targets if tg):
                                        ses.remove_torrent(h)
                                        print(f"🛑 Killed torrent: {h.status().name}", flush=True)
                                    else:
                                        active_handles.append(h)
                                handles = active_handles
                        except Exception: pass

                    # 2. Add Local .torrent Files from repository
                    for torrent_file in glob.glob("*.torrent"):
                        if torrent_file not in added_links:
                            try:
                                info = lt.torrent_info(torrent_file)
                                h = ses.add_torrent({'ti': info, 'save_path': folder})
                                handles.append(h)
                                added_links.add(torrent_file)
                                print(f"📥 Added local torrent file: {torrent_file}", flush=True)
                            except Exception as e:
                                print(f"⚠️ Failed to add local torrent {torrent_file}: {e}", flush=True)

                    # 3. Add Remote Links/Magnets/Torrent URLs (Concurrent)
                    if link_url:
                        try:
                            page = requests.get(link_url, timeout=5).text
                            for link in page.splitlines():
                                link = link.strip()
                                if link and not link.startswith('#') and link not in added_links:
                                    if link.startswith("magnet:"):
                                        p = lt.parse_magnet_uri(link)
                                        p.save_path = folder
                                        h = ses.add_torrent(p)
                                    else:
                                        r_tor = requests.get(link, timeout=10)
                                        if r_tor.status_code == 200:
                                            tmp_torrent = "temp_downloaded.torrent"
                                            with open(tmp_torrent, "wb") as tf:
                                                tf.write(r_tor.content)
                                            info = lt.torrent_info(tmp_torrent)
                                            h = ses.add_torrent({'ti': info, 'save_path': folder})
                                            os.remove(tmp_torrent)
                                        else:
                                            continue
                                    handles.append(h)
                                    added_links.add(link)
                                    print(f"📥 Added remote link concurrently: {link[:50]}...", flush=True)
                        except Exception: pass

                    # 4. Monitor Progress & ETA
                    if not handles:
                        print("📥 Waiting for active torrents...", flush=True)
                        all_done = False
                    else:
                        all_done = True
                        active_handles = []
                        print(f"\n" + "="*50, flush=True)
                        print(f"🔄 [Libtorrent-Filemirage] Progress Update #{update_count} | {timestamp}", flush=True)
                        print("-"*50, flush=True)
                        
                        for h in handles:
                            if not h.is_valid(): continue
                            active_handles.append(h)
                            s = h.status()
                            name = h.name() if h.has_metadata() else "Downloading metadata..."
                            prog = int(s.progress * 100)
                            speed_mb = s.download_rate / (1024 * 1024)
                            
                            eta = -1
                            if s.download_rate > 0:
                                total_want = s.total_wanted - s.total_wanted_done
                                if total_want > 0: eta = total_want / s.download_rate
                            eta_str = fmt_eta(eta)
                            
                            print(f"📥 Torrent: {name} | {prog}% | Speed: {speed_mb:.2f} MB/s | ETA: {eta_str}", flush=True)
                            if not (s.is_seeding or s.progress >= 1.0):
                                all_done = False
                        handles = active_handles
                        print("="*50 + "\n", flush=True)
                        
                        if all_done and handles:
                            print("✅ All downloads finished!", flush=True)
                            break

                    time.sleep(10)


                # 5. Smart Zip & Split Handling (Auto-Grouping Logic)
                print("Starting Auto-Group ZIP & Split handling...", flush=True)
                video_ext = ('.mp4', '.mkv', '.avi', '.mov', '.wmv', '.flv', '.webm', '.m4v')
                media_ext = video_ext + ('.srt', '.ass', '.vtt', '.sub')
                max_bytes = 9000 * 1024 * 1024

                def get_dir_size(p):
                    return sum(os.path.getsize(os.path.join(dp, f)) for dp, _, fn in os.walk(p) for f in fn)

                def create_7z_group(group_name, file_paths, base_dir, max_bytes_limit):
                    group_dir = os.path.join(base_dir, group_name)
                    os.makedirs(group_dir, exist_ok=True)
                    
                    # Also grab any associated subtitle files with the exact same stem
                    files_to_move = list(file_paths)
                    for p in file_paths:
                        base_stem = os.path.splitext(p)[0]
                        for sub_ext in ('.srt', '.ass', '.vtt', '.sub'):
                            sub_file = base_stem + sub_ext
                            if os.path.exists(sub_file) and sub_file not in files_to_move:
                                files_to_move.append(sub_file)

                    for p in files_to_move:
                        dst = os.path.join(group_dir, os.path.basename(p))
                        if p != dst and not os.path.exists(dst):
                            shutil.move(p, dst)
                    
                    folder_size = get_dir_size(group_dir)
                    zip_name = f"{group_name}.zip"
                    orig = os.getcwd()
                    os.chdir(base_dir)
                    cmd = ["7z", "a", "-mx0", zip_name, group_name]
                    if folder_size > max_bytes_limit:
                        cmd.insert(2, "-v7000m")
                    subprocess.run(cmd, check=True)
                    os.chdir(orig)
                    shutil.rmtree(group_dir)

                # RULE 4: Pre-Existing Folders with > 3 videos
                if os.path.exists(folder):
                    for item in os.listdir(folder):
                        item_path = os.path.join(folder, item)
                        if os.path.isdir(item_path):
                            vids = [
                                os.path.join(r, f) for r, _, files in os.walk(item_path)
                                for f in files if f.lower().endswith(video_ext)
                            ]
                            if len(vids) > 3:
                                print(f"📦 RULE 4 (Folder > 3 videos): Zipping {item}", flush=True)
                                folder_size = get_dir_size(item_path)
                                orig = os.getcwd()
                                os.chdir(folder)
                                zip_name = f"{item}.zip"
                                cmd = ["7z", "a", "-mx0", zip_name, item]
                                if folder_size > max_bytes:
                                    cmd.insert(2, "-v7000m")
                                subprocess.run(cmd, check=True)
                                os.chdir(orig)
                                shutil.rmtree(item_path)

                # Collect remaining videos for Rules 2 & 3
                remaining_videos = []
                for r, _, files in os.walk(folder):
                    for f in files:
                        if f.lower().endswith(video_ext):
                            remaining_videos.append(os.path.join(r, f))

                # RULE 2: Series Grouping by Season (>3 episodes)
                series_regex = re.compile(r'(?i)^(.*?)[.\s_-]+S(\d{1,2})(?:[EX\-]|\b)')
                def clean_series_name(raw_name):
                    return re.sub(r'(?i)(www\.[^\s]+\s*-\s*|^\[.*?\]\s*)', '', raw_name).strip('. -_')

                series_groups = defaultdict(list)
                for vid_path in remaining_videos:
                    vid_name = os.path.basename(vid_path)
                    parent_name = os.path.basename(os.path.dirname(vid_path))
                    # Check filename first, if missing check parent folder
                    match = series_regex.search(vid_name) or series_regex.search(parent_name)
                    if match:
                        s_name = clean_series_name(match.group(1))
                        s_num = match.group(2)
                        group_key = f"{s_name.lower()}_S{s_num}"
                        series_groups[group_key].append(vid_path)

                for group_key, vids in series_groups.items():
                    if len(vids) > 3:
                        first_stem = os.path.splitext(os.path.basename(vids[0]))[0]
                        print(f"📦 RULE 2 (Series > 3 eps): Grouping {len(vids)} episodes into {first_stem}.zip", flush=True)
                        create_7z_group(first_stem, vids, folder, max_bytes)
                        for v in vids:
                            if v in remaining_videos:
                                remaining_videos.remove(v)

                # RULE 3: The Leftovers (>3 loose videos)
                if len(remaining_videos) > 3:
                    first_stem = os.path.splitext(os.path.basename(remaining_videos[0]))[0]
                    print(f"📦 RULE 3 (Leftovers > 3 videos): Grouping {len(remaining_videos)} videos into {first_stem}.zip", flush=True)
                    create_7z_group(first_stem, remaining_videos, folder, max_bytes)
                    remaining_videos.clear()

                # RULE 1: Standalone Items (Upload Raw) - Flatten remaining structure
                for r, dirs, files in os.walk(folder, topdown=False):
                    if r == folder: continue
                    for f in files:
                        if f.lower().endswith(media_ext):
                            src = os.path.join(r, f)
                            dst = os.path.join(folder, f)
                            if not os.path.exists(dst): 
                                shutil.move(src, dst)
                    shutil.rmtree(r, ignore_errors=True)

                # 6. Upload to Filemirage
                server = requests.get("https://filemirage.com/api/servers").json().get("data", {}).get("server")
                headers = {"Authorization": f"Bearer {token}"}

                for root, _, files in os.walk(folder):
                    for name in sorted(files):
                        # Ignore temp download pieces
                        if name.endswith(('.!qB', '.part')): continue
                        path = os.path.join(root, name)
                        if not os.path.isfile(path): continue
                        
                        print(f"⬆️ Uploading: {name}", flush=True)
                        with open(path, "rb") as f:
                            r = requests.post(f"{server}/upload.php", headers=headers, files={"file": (name, f)})
                            print(f"✅ Status: {r.status_code}", flush=True)
                PYTHON
